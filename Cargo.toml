[package]
name = "fims"
version = "0.1.0"
edition = "2024"

[features]
debug = ["axum/macros"]

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.52.3", features = ["full"] }
minijinja = { version = "2.19.0", features = ["loader"] }
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.6.10", features = ["fs"] }
tower = "0.5.3"
serde_json = "1.0.149"
tower-sessions = { version = "0.15.0", features = ["signed"] }
tower-sessions-file-store = "0.2.0"
time = "0.3.55"
async-trait = "0.1.92"
minijinja-autoreload = { version = "2.24.0" }
uuid = { version = "1.27", features = ["serde", "v7"] }
aws-sdk-s3 = "1.152"
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "uuid",
] }
reqwest = { version = "0.13", features = ["form", "json"] }
url = { version = "2.5.8", features = ["serde"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
toml = "1.1.8"
chrono = "0.4.45"
